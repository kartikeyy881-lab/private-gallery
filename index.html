<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shreyas Randii Khana.com</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.18)),
        url("background.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .overlay {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;

      padding: 45px 25px;

      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 30px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: clamp(30px, 7vw, 55px);
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 45px;

      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.45);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
    }

    .button {
      width: min(320px, 90%);

      padding: 18px 25px;

      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.55);

      background: rgba(255, 255, 255, 0.18);
      color: white;

      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1px;

      cursor: pointer;
      text-decoration: none;

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      transition: all 0.3s ease;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.32);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .button:active {
      transform: scale(0.97);
    }

    .icon {
      margin-right: 10px;
      font-size: 24px;
    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.75;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 38px 18px;
        border-radius: 25px;
      }

      h1 {
        margin-bottom: 35px;
        letter-spacing: 1px;
      }

      .button {
        padding: 16px 20px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="overlay">

    <main class="container">

      <h1>Shreyas Randii Khana.com</h1>

      <div class="buttons">

        <a href="#" class="button">
          <span class="icon">📸</span>
          PHOTOS
        </a>

        <a href="#" class="button">
          <span class="icon">🎬</span>
          VIDEOS
        </a>

      </div>

      <div class="footer">
        Private Gallery
      </div>

    </main>

  </div>

</body>
</html>
