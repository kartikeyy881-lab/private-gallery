<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Private Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 35px;
            opacity: 0.8;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            width: 180px;
            height: 100px;

            border: none;
            border-radius: 20px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            background: white;
            color: #111;

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-5px) scale(1.03);
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Private Gallery</h1>

        <p>A private place for my memories</p>

        <div class="buttons">

            <button onclick="openPhotos()">
                📸<br>
                PHOTOS
            </button>

            <button onclick="openVideos()">
                🎬<br>
                VIDEOS
            </button>

        </div>

    </div>

    <script>

        function openPhotos() {
            alert("Photos section coming soon!");
        }

        function openVideos() {
            alert("Videos section coming soon!");
        }

    </script>

</body>
</html>
