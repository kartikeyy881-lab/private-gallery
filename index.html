<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Private personal gallery">

    <meta name="theme-color" content="#000000">

    <title>Shreyas Randii Khana.com</title>


    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            width: 100%;
            min-height: 100%;
        }


        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background-image:
                url("file_00000000b3cc821186a0555d3845b47b.png");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow-x: hidden;
        }


        /* =========================
           MAIN SCREEN
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }


        /* =========================
           GLASS CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 650px;

            padding: 55px 30px;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.20);

            border:
                1px solid
                rgba(255, 255, 255, 0.35);

            border-radius: 32px;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.30);
        }


        /* =========================
           WEBSITE TITLE
        ========================= */

        .title {
            font-size:
                clamp(30px, 7vw, 56px);

            font-weight:
                500;

            letter-spacing:
                2px;

            line-height:
                1.2;

            margin-bottom:
                48px;

            text-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.65);
        }


        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 22px;
        }


        /* =========================
           MAIN BUTTON
        ========================= */

        .button {
            width:
                min(340px, 90%);

            min-height:
                62px;

            padding:
                17px 25px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius:
                50px;

            border:
                1px solid
                rgba(255, 255, 255, 0.55);

            background:
                rgba(255, 255, 255, 0.18);

            color:
                white;

            font-size:
                20px;

            font-weight:
                500;

            letter-spacing:
                1px;

            text-decoration:
                none;

            cursor:
                pointer;

            backdrop-filter:
                blur(6px);

            -webkit-backdrop-filter:
                blur(6px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.15);

            transition:
                all 0.3s ease;
        }


        /* =========================
           BUTTON HOVER
        ========================= */

        .button:hover {

            background:
                rgba(255, 255, 255, 0.30);

            transform:
                translateY(-4px);

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.30);
        }


        /* =========================
           BUTTON PRESS
        ========================= */

        .button:active {

            transform:
                scale(0.97);
        }


        /* =========================
           ICON
        ========================= */

        .icon {

            font-size:
                25px;

            margin-right:
                12px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top:
                42px;

            font-size:
                13px;

            letter-spacing:
                1.5px;

            opacity:
                0.80;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.50);
        }


        /* =========================
           MOBILE SCREEN
        ========================= */

        @media (max-width: 600px) {

            .page {

                padding:
                    18px;
            }


            .container {

                padding:
                    42px 18px;

                border-radius:
                    27px;
            }


            .title {

                font-size:
                    clamp(28px, 8vw, 42px);

                letter-spacing:
                    1px;

                margin-bottom:
                    36px;
            }


            .buttons {

                gap:
                    18px;
            }


            .button {

                width:
                    92%;

                min-height:
                    58px;

                padding:
                    15px 18px;

                font-size:
                    18px;
            }


            .icon {

                font-size:
                    23px;

                margin-right:
                    9px;
            }


            .footer {

                margin-top:
                    34px;
            }
        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .container {

                padding:
                    35px 14px;
            }


            .title {

                font-size:
                    27px;

                margin-bottom:
                    30px;
            }


            .button {

                font-size:
                    17px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN PAGE
    ========================= -->

    <div class="page">


        <!-- =========================
             MAIN CONTAINER
        ========================= -->

        <main class="container">


            <!-- WEBSITE TITLE -->

            <h1 class="title">
                Shreyas Randii Khana.com
            </h1>


            <!-- =========================
                 BUTTONS
            ========================= -->

            <div class="buttons">


                <!-- PHOTOS -->

                <a
                    href="#"
                    class="button"
                    aria-label="Open Photos"
                >

                    <span class="icon">
                        📸
                    </span>

                    <span>
                        PHOTOS
                    </span>

                </a>


                <!-- VIDEOS -->

                <a
                    href="#"
                    class="button"
                    aria-label="Open Videos"
                >

                    <span class="icon">
                        🎬
                    </span>

                    <span>
                        VIDEOS
                    </span>

                </a>


            </div>


            <!-- =========================
                 FOOTER
            ========================= -->

            <div class="footer">

                Private Gallery

            </div>


        </main>


    </div>


</body>

</html>
